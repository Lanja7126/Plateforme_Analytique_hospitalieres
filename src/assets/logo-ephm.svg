<svg
  viewBox="0 0 400 440"
  width="400"
  height="440"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Logo EPHM — Évaluation des Performances Hospitalières à Madagascar"
>
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3A8F" />
      <stop offset="100%" stop-color="#2E7DD4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E09000" />
      <stop offset="100%" stop-color="#F9C74F" />
    </linearGradient>
    <filter id="shadow" x="-12%" y="-8%" width="124%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#1A3A8F" flood-opacity="0.22" />
    </filter>
    <clipPath id="badgeClip">
      <rect x="8" y="8" width="384" height="340" rx="52" />
    </clipPath>
  </defs>

  <!-- Badge — pleine largeur -->
  <rect x="8" y="8" width="384" height="340" rx="52" fill="url(#badgeGrad)" filter="url(#shadow)" />
  <rect x="8" y="8" width="384" height="160" rx="52" fill="white" opacity="0.06" clip-path="url(#badgeClip)" />

  <!-- Medical cross -->
  <rect x="100" y="148" width="200" height="58" rx="10" fill="white" />
  <rect x="171" y="77" width="58" height="200" rx="10" fill="white" />

  <!-- Performance bars (gold) -->
  <rect x="296" y="178" width="16" height="30" rx="4" fill="url(#goldGrad)" />
  <rect x="315" y="160" width="16" height="48" rx="4" fill="url(#goldGrad)" />
  <rect x="334" y="138" width="16" height="70" rx="4" fill="url(#goldGrad)" />
  <polyline points="334,134 342,122 352,134" fill="none" stroke="#F9C74F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Madagascar island -->
  <g clip-path="url(#badgeClip)" opacity="0.2">
    <ellipse cx="52" cy="290" rx="14" ry="32" fill="white" transform="rotate(-8, 52, 290)" />
    <ellipse cx="57" cy="270" rx="9" ry="12" fill="white" transform="rotate(-8, 57, 270)" />
  </g>

  <!-- Badge border -->
  <rect x="8" y="8" width="384" height="340" rx="52" fill="none" stroke="white" stroke-width="1.5" opacity="0.2" />

  <!-- EPHM acronym -->
  <text x="200" y="392" text-anchor="middle" font-size="34" letter-spacing="12" fill="#1A3A8F" font-family="Georgia, 'Times New Roman', serif" font-weight="700">EPHM</text>

  <!-- Gold rule -->
  <rect x="140" y="403" width="120" height="3" rx="1.5" fill="url(#goldGrad)" />

  <!-- Tagline -->
  <text x="200" y="428" text-anchor="middle" font-size="10" letter-spacing="1.8" fill="#4A6080" font-family="Arial, sans-serif">PERFORMANCES HOSPITALIÈRES · MADAGASCAR</text>
</svg>
